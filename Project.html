<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>

        <p>
            <span id="date"></span> |
            <span id="time"></span>
        </p>
    </header>

    <!-- MESSAGE -->
    <div id="message" class="message"></div>

    <!-- SEARCH AND FILTER -->
    <section class="search-section">

        <h2>Search Employee</h2>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search employee name..."
            >

            <button
                class="search-btn"
                id="searchBtn"
            >
                Search
            </button>

        </div>

        <div class="filter-buttons">

            <button onclick="filterDepartment('All')">
                All Employees
            </button>

            <button onclick="filterDepartment('IT')">
                IT
            </button>

            <button onclick="filterDepartment('HR')">
                HR
            </button>

            <button onclick="filterDepartment('Finance')">
                Finance
            </button>

            <button onclick="filterDepartment('Marketing')">
                Marketing
            </button>

        </div>

    </section>

    <!-- DASHBOARD -->
    <section class="dashboard">

        <div class="stat-card">
            <h3>Employee Count</h3>
            <p id="employeeCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Salary</h3>
            <p id="totalSalary">₹0</p>
        </div>

        <div class="stat-card">
            <h3>Average Salary</h3>
            <p id="averageSalary">₹0</p>
        </div>

        <div class="stat-card">
            <h3>Highest Salary</h3>
            <p id="highestSalary">₹0</p>
        </div>

    </section>

    <!-- HIGHEST PAID EMPLOYEE -->
    <section class="highest">

        <h2>🏆 Highest Paid Employee</h2>

        <p id="highestEmployee">
            No employee data available
        </p>

    </section>

    <!-- SORT -->
    <section class="sort-section">

        <h2>Sort Employees</h2>

        <button onclick="sortEmployees('name')">
            Sort by Name
        </button>

        <button onclick="sortEmployees('age')">
            Sort by Age
        </button>

        <button onclick="sortEmployees('salary')">
            Sort by Salary
        </button>

    </section>

    <!-- EMPLOYEE LIST -->
    <h2>Employee List</h2>

    <div
        id="employeeContainer"
        class="employee-container">
    </div>

    <!-- ADD EMPLOYEE -->
    <section class="add-section">

        <h2>ADD EMPLOYEE</h2>

        <div
            id="errorMessage"
            class="error">
        </div>

        <form id="employeeForm">

            <!-- NAME -->
            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter employee name"
                >

            </div>

            <!-- AGE -->
            <div class="form-group">

                <label>Age</label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter age"
                >

            </div>

            <!-- EMAIL -->
            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                >

            </div>

            <!-- DEPARTMENT -->
            <div class="form-group">

                <label>Department</label>

                <select id="department">

                    <option value="">
                        Select Department
                    </option>

                    <option value="IT">
                        IT
                    </option>

                    <option value="HR">
                        HR
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                </select>

            </div>

            <!-- SALARY -->
            <div class="form-group">

                <label>Salary</label>

                <input
                    type="number"
                    id="salary"
                    placeholder="Enter salary"
                    min="1"
                >

            </div>

            <button
                type="submit"
                class="add-btn">

                Add Employee

            </button>

        </form>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
