```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        header h1 {
            margin-bottom: 12px;
        }

        .date-time {
            font-size: 15px;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #e5e7eb;
            text-align: center;
            display: none;
        }

        .search-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .search-btn {
            background: #2563eb;
            color: white;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .filter-buttons button {
            background: #e5e7eb;
        }

        .filter-buttons button:hover {
            background: #2563eb;
            color: white;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 22px;
            font-weight: bold;
        }

        .highest {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .highest h2 {
            margin-bottom: 10px;
        }

        .employee-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .employee-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .employee-card:hover {
            transform: translateY(-3px);
        }

        .employee-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: block;
            margin: auto;
            object-fit: cover;
        }

        .employee-card h3 {
            text-align: center;
            margin: 12px 0;
        }

        .employee-card p {
            margin: 7px 0;
            font-size: 14px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            width: 100%;
            margin-top: 12px;
        }

        .add-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .add-section h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .add-btn {
            background: #16a34a;
            color: white;
            width: 100%;
            padding: 13px;
        }

        .error {
            color: #dc2626;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .sort-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .sort-section button {
            background: #7c3aed;
            color: white;
            margin: 5px;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        @media (max-width: 900px) {
            .employee-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .employee-container {
                grid-template-columns: 1fr;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>
        <div class="date-time">
            <span id="date"></span> |
            <span id="time"></span>
        </div>
    </header>

    <!-- MESSAGE -->
    <div id="message" class="message"></div>

    <!-- SEARCH -->
    <section class="search-section">

        <h2>Search Employee</h2>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search employee name..."
            >

            <button class="search-btn" id="searchBtn">
                Search
            </button>
        </div>

        <div class="filter-buttons">

            <button onclick="filterDepartment('All')">
                All
            </button>

            <button onclick="filterDepartment('IT')">
                IT
            </button>

            <button onclick="filterDepartment('HR')">
                HR
            </button>

            <button onclick="filterDepartment('Finance')">
                Finance
            </button>

            <button onclick="filterDepartment('Marketing')">
                Marketing
            </button>

        </div>

    </section>


    <!-- DASHBOARD -->
    <section class="dashboard">

        <div class="stat-card">
            <h3>Total Employees</h3>
            <p id="employeeCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Salary</h3>
            <p id="totalSalary">₹0</p>
        </div>

        <div class="stat-card">
            <h3>Average Salary</h3>
            <p id="averageSalary">₹0</p>
        </div>

        <div class="stat-card">
            <h3>Highest Salary</h3>
            <p id="highestSalary">₹0</p>
        </div>

    </section>


    <!-- HIGHEST PAID EMPLOYEE -->
    <section class="highest">

        <h2>🏆 Highest Paid Employee</h2>

        <p id="highestEmployee">
            No employee data available
        </p>

    </section>


    <!-- SORT -->
    <section class="sort-section">

        <h2>Sort Employees</h2>

        <button onclick="sortEmployees('name')">
            Sort by Name
        </button>

        <button onclick="sortEmployees('age')">
            Sort by Age
        </button>

        <button onclick="sortEmployees('salary')">
            Sort by Salary
        </button>

    </section>


    <!-- EMPLOYEE CARDS -->
    <section>

        <h2 style="margin-bottom:15px;">
            Employees
        </h2>

        <div
            id="employeeContainer"
            class="employee-container">
        </div>

    </section>


    <!-- ADD EMPLOYEE -->
    <section class="add-section">

        <h2>ADD EMPLOYEE</h2>

        <div id="errorMessage" class="error"></div>

        <form id="employeeForm">

            <div class="form-group">
                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter employee name">
            </div>


            <div class="form-group">
                <label>Age</label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter age">
            </div>


            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email">
            </div>


            <div class="form-group">
                <label>Department</label>

                <select id="department">

                    <option value="">
                        Select Department
                    </option>

                    <option value="IT">
                        IT
                    </option>

                    <option value="HR">
                        HR
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                </select>

            </div>


            <div class="form-group">
                <label>Salary</label>

                <input
                    type="number"
                    id="salary"
                    placeholder="Enter salary">
            </div>


            <button
                type="submit"
                class="add-btn">

                Add Employee

            </button>

        </form>

    </section>

</div>


<script>

    // ==========================================
    // GLOBAL VARIABLES
    // ==========================================

    let employees = [];

    let displayedEmployees = [];

    let selectedDepartment = "All";


    // ==========================================
    // DATE & TIME
    // ==========================================

    function updateDateTime() {

        const now = new Date();

        const day = now.getDate();

        const month = now.toLocaleString("en-IN", {
            month: "long"
        });

        const year = now.getFullYear();

        let hours = now.getHours();

        const minutes = String(
            now.getMinutes()
        ).padStart(2, "0");

        const seconds = String(
            now.getSeconds()
        ).padStart(2, "0");

        const ampm = hours >= 12 ? "PM" : "AM";

        hours = hours % 12 || 12;

        document.getElementById("date").textContent =
            `Today: ${day} ${month} ${year}`;

        document.getElementById("time").textContent =
            `Time: ${hours}:${minutes}:${seconds} ${ampm}`;
    }

    updateDateTime();

    setInterval(updateDateTime, 1000);


    // ==========================================
    // FETCH EMPLOYEES
    // ==========================================

    function fetchEmployees() {

        showMessage(
            "Loading employees...",
            "loading"
        );

        fetch("https://dummyjson.com/users")

            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "API request failed"
                    );
                }

                return response.json();
            })

            .then(data => {

                employees = data.users.map(user => ({

                    id: user.id,

                    name:
                        `${user.firstName} ${user.lastName}`,

                    age: user.age,

                    email: user.email,

                    phone: user.phone,

                    department:
                        user.company?.department || "IT",

                    image: user.image,

                    // API does not provide salary,
                    // so we create salary locally.
                    salary:
                        30000 + (user.id * 2500)

                }));

                displayedEmployees = [...employees];

                displayEmployees(displayedEmployees);

                updateDashboard(displayedEmployees);

                showMessage(
                    "Employee data loaded successfully.",
                    "success"
                );

            })

            .catch(error => {

                console.error(error);

                showMessage(
                    "Unable to load employee data. Please try again.",
                    "error"
                );

            })

            .finally(() => {

                console.log(
                    "API request completed."
                );

            });
    }


    // ==========================================
    // DISPLAY EMPLOYEES
    // ==========================================

    function displayEmployees(employeeList) {

        const container =
            document.getElementById(
                "employeeContainer"
            );

        container.innerHTML = "";

        displayedEmployees = employeeList;

        if (employeeList.length === 0) {

            const emptyMessage =
                document.createElement("div");

            emptyMessage.className = "empty";

            emptyMessage.innerHTML =
                "<h3>No employees found</h3>";

            container.appendChild(
                emptyMessage
            );

            updateDashboard([]);

            return;
        }


        employeeList.forEach(employee => {

            const card =
                document.createElement("div");

            card.className =
                "employee-card";


            const image =
                document.createElement("img");

            image.setAttribute(
                "src",
                employee.image ||
                "https://via.placeholder.com/100"
            );

            image.setAttribute(
                "alt",
                employee.name
            );


            const name =
                document.createElement("h3");

            name.innerHTML =
                employee.name;


            const details =
                document.createElement("div");

            details.innerHTML = `

                <p><strong>Age:</strong>
                    ${employee.age}
                </p>

                <p><strong>Email:</strong>
                    ${employee.email}
                </p>

                <p><strong>Department:</strong>
                    ${employee.department}
                </p>

                <p><strong>Phone:</strong>
                    ${employee.phone || "Not available"}
                </p>

                <p><strong>Salary:</strong>
                    ₹${employee.salary.toLocaleString("en-IN")}
                </p>

            `;


            const deleteButton =
                document.createElement("button");

            deleteButton.innerHTML =
                "Delete";

            deleteButton.className =
                "delete-btn";


            deleteButton.addEventListener(
                "click",
                () => {

                    deleteEmployee(
                        employee.id
                    );

                }
            );


            card.appendChild(image);

            card.appendChild(name);

            card.appendChild(details);

            card.appendChild(deleteButton);

            container.appendChild(card);

        });


        updateDashboard(employeeList);
    }


    // ==========================================
    // SEARCH EMPLOYEES
    // ==========================================

    function searchEmployees() {

        const searchText =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();


        let result = employees.filter(
            employee => {

                const name =
                    employee.name.toLowerCase();

                return name.includes(searchText);

            }
        );


        if (selectedDepartment !== "All") {

            result = result.filter(
                employee =>
                    employee.department.toLowerCase()
                    === selectedDepartment.toLowerCase()
            );

        }


        displayEmployees(result);
    }


    document
        .getElementById("searchBtn")
        .addEventListener(
            "click",
            searchEmployees
        );


    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            searchEmployees
        );


    // ==========================================
    // DEPARTMENT FILTER
    // ==========================================

    function filterDepartment(department) {

        selectedDepartment =
            department;


        const searchText =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();


        let result = employees.filter(
            employee => {

                const matchesDepartment =
                    department === "All" ||
                    employee.department
                        .toLowerCase()
                        === department.toLowerCase();


                const matchesSearch =
                    employee.name
                        .toLowerCase()
                        .includes(searchText);


                return (
                    matchesDepartment &&
                    matchesSearch
                );
            }
        );


        displayEmployees(result);
    }


    // ==========================================
    // ADD EMPLOYEE
    // ==========================================

    document
        .getElementById("employeeForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                addEmployee();

            }
        );


    function addEmployee() {

        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const age =
            Number(
                document
                    .getElementById("age")
                    .value
            );


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const department =
            document
                .getElementById("department")
                .value;


        const salary =
            Number(
                document
                    .getElementById("salary")
                    .value
            );


        const validation =
            validateEmployee(
                name,
                age,
                email,
                department,
                salary
            );


        if (!validation.valid) {

            document
                .getElementById("errorMessage")
                .textContent =
                    validation.message;

            return;
        }


        const employee = {

            id:
                Date.now(),

            name: name,

            age: age,

            email: email,

            department: department,

            phone: "Not available",

            salary: salary,

            image:
                "https://ui-avatars.com/api/?name="
                + encodeURIComponent(name)

        };


        employees = [
            ...employees,
            employee
        ];


        selectedDepartment = "All";

        document
            .getElementById("searchInput")
            .value = "";


        displayEmployees(employees);

        clearForm();


        document
            .getElementById("errorMessage")
            .textContent = "";


        showMessage(
            "Employee added successfully.",
            "success"
        );

    }


    // ==========================================
    // VALIDATE EMPLOYEE
    // ==========================================

    function validateEmployee(
        name,
        age,
        email,
        department,
        salary
    ) {

        if (name === "") {

            return {
                valid: false,
                message:
                    "❌ Please enter employee name"
            };

        }


        if (age <= 18 || isNaN(age)) {

            return {
                valid: false,
                message:
                    "❌ Age must be greater than 18"
            };

        }


        if (email === "") {

            return {
                valid: false,
                message:
                    "❌ Please enter employee email"
            };

        }


        if (!email.includes("@")) {

            return {
                valid: false,
                message:
                    "❌ Please enter a valid email"
            };

        }


        if (department === "") {

            return {
                valid: false,
                message:
                    "❌ Please select a department"
            };

        }


        if (salary <= 0 || isNaN(salary)) {

            return {
                valid: false,
                message:
                    "❌ Please enter a valid salary"
            };

        }


        return {
            valid: true,
            message: ""
        };
    }


    // ==========================================
    // DELETE EMPLOYEE
    // ==========================================

    function deleteEmployee(id) {

        employees =
            employees.filter(
                employee =>
                    employee.id !== id
            );


        let result = employees;


        if (selectedDepartment !== "All") {

            result = result.filter(
                employee =>
                    employee.department
                        .toLowerCase()
                    ===
                    selectedDepartment
                        .toLowerCase()
            );

        }


        const searchText =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();


        if (searchText !== "") {

            result = result.filter(
                employee =>
                    employee.name
                        .toLowerCase()
                        .includes(searchText)
            );

        }


        displayEmployees(result);


        showMessage(
            "Employee deleted successfully.",
            "success"
        );
    }


    // ==========================================
    // SALARY CALCULATION
    // ==========================================

    function calculateSalary(employeeList) {

        const totalSalary =
            employeeList.reduce(
                (total, employee) =>
                    total + employee.salary,
                0
            );


        const averageSalary =
            employeeList.length > 0
                ? totalSalary /
                  employeeList.length
                : 0;


        const highestEmployee =
            employeeList.length > 0
                ? employeeList.reduce(
                    (highest, employee) =>
                        employee.salary >
                        highest.salary
                            ? employee
                            : highest
                )
                : null;


        return {
            totalSalary,
            averageSalary,
            highestEmployee
        };
    }


    // ==========================================
    // UPDATE DASHBOARD
    // ==========================================

    function updateDashboard(employeeList) {

        const salaryData =
            calculateSalary(
                employeeList
            );


        document
            .getElementById("employeeCount")
            .textContent =
                employeeList.length;


        document
            .getElementById("totalSalary")
            .textContent =
                "₹" +
                salaryData.totalSalary
                    .toLocaleString("en-IN");


        document
            .getElementById("averageSalary")
            .textContent =
                "₹" +
                Math.round(
                    salaryData.averageSalary
                )
                .toLocaleString("en-IN");


        document
            .getElementById("highestSalary")
            .textContent =
                salaryData.highestEmployee
                    ? "₹" +
                      salaryData.highestEmployee.salary
                        .toLocaleString("en-IN")
                    : "₹0";


        const highestEmployee =
            document
                .getElementById(
                    "highestEmployee"
                );


        if (salaryData.highestEmployee) {

            highestEmployee.innerHTML = `

                <strong>
                    Name:
                </strong>
                ${salaryData.highestEmployee.name}

                <br>

                <strong>
                    Salary:
                </strong>
                ₹${salaryData.highestEmployee.salary
                    .toLocaleString("en-IN")}

            `;

        } else {

            highestEmployee.textContent =
                "No employee data available";
        }

    }


    // ==========================================
    // SORT EMPLOYEES
    // ==========================================

    function sortEmployees(type) {

        let sortedEmployees =
            [...displayedEmployees];


        if (type === "name") {

            sortedEmployees.sort(
                (a, b) =>
                    a.name.localeCompare(
                        b.name
                    )
            );

        }


        else if (type === "age") {

            sortedEmployees.sort(
                (a, b) =>
                    a.age - b.age
            );

        }


        else if (type === "salary") {

            sortedEmployees.sort(
                (a, b) =>
                    b.salary - a.salary
            );

        }


        displayEmployees(
            sortedEmployees
        );
    }


    // ==========================================
    // CLEAR FORM
    // ==========================================

    function clearForm() {

        document
            .getElementById("employeeForm")
            .reset();

    }


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.textContent = text;

        message.style.display =
            "block";


        setTimeout(
            () => {

                message.style.display =
                    "none";

            },
            3000
        );
    }


    // ==========================================
    // START APPLICATION
    // ==========================================

    fetchEmployees();

</script>

</body>
</html>
